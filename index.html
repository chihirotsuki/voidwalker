<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>voidwalker | bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #c8d6e8 0%, #dce6f5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .link-card {
            max-width: 480px;
            width: 100%;
            background: rgba(235, 242, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(180, 200, 235, 0.5);
            border-radius: 40px;
            padding: 32px 28px 38px;
            box-shadow: 0 20px 40px rgba(60, 100, 180, 0.10), 0 0 0 1px rgba(180, 200, 235, 0.3);
            transition: all 0.3s ease;
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
            will-change: transform;
            color: #1a2a4a;
        }

        .link-card:hover {
            transform: translateY(-6px);   
            box-shadow: 0 25px 50px rgba(60, 100, 180, 0.15);
        }

        /* ===== 標題 ===== */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(60, 100, 180, 0.10);
        }

        /* ===== 頭像 ===== */
        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 4px;
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #b8cce8, #8aacd4);
            border: 2px solid rgba(180, 200, 235, 0.6);
            box-shadow: 0 4px 20px rgba(60, 100, 180, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 300;
            color: #2a4a7a;
            letter-spacing: 2px;
            transition: 0.2s;
            overflow: hidden;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><circle cx="50" cy="50" r="48" fill="%23c5d8f0" stroke="%238aacd4" stroke-width="1.5"/><circle cx="50" cy="40" r="18" fill="%23aac0e0" opacity="0.6"/><circle cx="50" cy="78" r="24" fill="%23aac0e0" opacity="0.4"/></svg>');
            background-size: cover;
            background-position: center;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #3a6aaa, #1a4a8a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 8px rgba(60, 100, 180, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-name small {
            font-size: 18px;
            font-weight: 400;
            background: rgba(60, 100, 180, 0.06);
            padding: 0 12px;
            border-radius: 40px;
            color: #4a7aaa;
            letter-spacing: 0.3px;
            border: 1px solid rgba(60, 100, 180, 0.08);
        }

        .muu-block {
            background: rgba(180, 200, 235, 0.3);
            border-radius: 60px;
            padding: 6px 24px 6px 28px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #6a9acc;
            backdrop-filter: blur(4px);
            margin-top: 2px;
            width: fit-content;
        }
        .muu-block span {
            font-size: 20px;
            font-weight: 500;
            color: #2a5a8a;
            letter-spacing: 0.5px;
        }

        /* ===== 自介 ===== */
        .profile-section {
            margin: 32px 0 30px;
            background: rgba(200, 220, 245, 0.30);
            border-radius: 28px;
            padding: 22px 24px 24px;
            border: 1px solid rgba(180, 200, 235, 0.4);
            backdrop-filter: blur(4px);
        }
        .profile-title {
            font-size: 18px;
            font-weight: 600;
            color: #3a6aaa;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(60, 100, 180, 0.08);
            padding-bottom: 12px;
        }

        .profile-grid {
            display: flex;
            flex-direction: column;
        }

        .profile-text {
            white-space: pre-line;
        }

        .profile-content {
            font-size: 14px;
            color: #2a5a8a;
            line-height: 24px;
            letter-spacing: 2px;
        }

        /* ===== 連結 ===== */
        .social-section {
            margin: 16px 0 6px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(200, 220, 245, 0.25);
            border-radius: 60px;
            padding: 14px 22px 14px 26px;
            border: 1px solid rgba(180, 200, 235, 0.35);
            transition: 0.2s;
            backdrop-filter: blur(2px);
            cursor: default;
        }
        .social-item:hover {
            background: rgba(200, 220, 245, 0.50);
            border-color: rgba(100, 150, 210, 0.30);
            box-shadow: 0 4px 12px rgba(60, 100, 180, 0.06);
        }

        .social-label {
            font-size: 18px;
            font-weight: 500;
            color: #2a5a8a;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .social-label a {
            text-decoration: none;
            color: #2a5a8a;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }

        .social-label a:hover {
            color: #1a3a6a;
        }

        .social-placeholder {
            font-size: 16px;
            background: rgba(200, 220, 245, 0.25);
            padding: 5px 18px;
            border-radius: 40px;
            color: #4a7aaa;
            border: 1px solid rgba(60, 100, 180, 0.06);
            font-weight: 400;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .social-item.youtube .social-placeholder {
            color: #4a7aaa;
            border-color: rgba(60, 100, 180, 0.06);
        }
        .social-item.discord .social-placeholder {
            color: #4a7aaa;
            border-color: rgba(60, 100, 180, 0.06);
        }

        @media (max-width: 460px) {
            .link-card {
                padding: 24px 18px 28px;
                border-radius: 32px;
            }
            .brand-name {
                font-size: 28px;
                flex-wrap: wrap;
            }
            .brand-name small {
                font-size: 16px;
            }
            .muu-block {
                padding: 4px 18px 4px 22px;
            }
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 28px;
            }
            .social-item {
                padding: 12px 16px 12px 18px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .social-label {
                font-size: 16px;
            }
            .social-placeholder {
                font-size: 14px;
                padding: 4px 14px;
            }
        }

        .footer-note {
            margin-top: 28px;
            font-size: 11px;
            color: #6a9acc;
            text-align: center;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(60, 100, 180, 0.06);
            padding-top: 18px;
        }
    </style>
</head>
<body>
    <div class="link-card">

        <!-- 標題 + 頭像 -->
        <div class="brand">
            <div class="avatar-wrapper">
                <div class="avatar" id="avatarContainer">
                    <img src="https://cdn.discordapp.com/avatars/485708071373635585/796bc5fb3c0a4fd98146cb88caa2a628.png?size=1024" alt="avatar">
                </div>
            </div>

            <div class="brand-name">
                Link
                <small>✦</small>
            </div>
            <div class="muu-block">
                <span>✧ voidwalker</span>
            </div>
        </div>

        <!-- 自介 -->
        <div class="profile-section">
            <div class="profile-title">自我介紹</div>
            <div class="profile-grid profile-content profile-text">bedwars老人
                <strong>In case of fire</strong>◇ git commit
                ◇ git push
                ◇ leave building
            </div>
        </div>

        <!-- 連結 -->
        <div class="social-section">
            <!-- YouTube -->
            <div class="social-item youtube">
                <span class="social-label">
                    <a href="https://www.youtube.com/@voidwalker-IlIl" target="_blank">
                        <i class="fab fa-youtube"></i>「YouTube」
                    </a>
                </span>
                <span class="social-placeholder"></span>
            </div>
            <!-- Discord -->
            <div class="social-item discord">
                <span class="social-label">
                    <i class="fab fa-discord"></i>「Discord」
                </span>
                <span class="social-placeholder"></span>
            </div>
        </div>

        <div class="footer-note">
            ⚡ Link · voidwalker
        </div>
    </div>

    <script>
        const discordItems = document.querySelectorAll('.social-item.discord');
        
        discordItems.forEach(item => {
            const placeholder = item.querySelector('.social-placeholder');
            const username = '@immergination';

            item.addEventListener('mouseenter', () => {
                placeholder.textContent = username;
            });

            item.addEventListener('mouseleave', () => {
                placeholder.textContent = '';
            });
        });
    </script>
</body>
</html>
